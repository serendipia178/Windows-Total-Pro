<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><title>Windows Total Pro v6</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:15px "Segoe UI",Arial;color:#f7fbff}body{background:radial-gradient(ellipse at 20% 25%,#7baac4,transparent 38%),radial-gradient(ellipse at 75% 70%,#2d6684,transparent 45%),linear-gradient(130deg,#0b1c33,#315f7c)}button{font:inherit;cursor:pointer;border:1px solid #ffffff70;border-radius:7px;padding:8px 12px;background:linear-gradient(#ffffff45,#ffffff12);color:inherit;box-shadow:0 2px 5px #0005}button:active{transform:translateY(1px)}#desktop{position:absolute;inset:0 0 48px;padding:16px;background-size:cover;background-position:center}#icons{display:grid;grid-template-columns:repeat(auto-fill,82px);gap:8px}.desk{height:86px;background:transparent;border-color:transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:5px;text-shadow:0 2px 4px #000}.desk span{font-size:34px}.desk small{font-size:12px}#bar{position:absolute;bottom:0;height:48px;width:100%;display:flex;align-items:center;gap:8px;padding:5px;background:linear-gradient(#d8e9f4bb,#18344feF);backdrop-filter:blur(15px);border-top:1px solid #fff}#start{border-radius:20px;background:linear-gradient(#b9e5a1,#27622d)}#tasks{display:flex;gap:4px;flex:1;overflow:auto}#clock{font-size:12px;min-width:52px;text-align:center}#menu{display:none;position:absolute;bottom:48px;left:8px;width:min(350px,95vw);padding:13px;background:#d8e9f3ed;color:#17324d;border:1px solid white;border-radius:12px 12px 0 0;box-shadow:0 12px 30px #0009;z-index:1000}#menu.show{display:block}#menu button{color:#17324d;background:#ffffffbd;margin:4px}.win{position:absolute;left:8%;top:8%;width:min(700px,88vw);height:min(520px,78vh);min-width:260px;min-height:190px;display:flex;flex-direction:column;resize:both;overflow:hidden;background:#e2eef7;color:#17324d;border:1px solid white;border-radius:9px;box-shadow:0 15px 40px #0009;z-index:20}.head{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:5px 8px 5px 12px;background:linear-gradient(#fff,#b8d1e4);touch-action:none;user-select:none}.title{flex:1;font-weight:bold}.head button{padding:3px 9px;color:#17324d}.body{padding:14px;overflow:auto;flex:1}.body button{color:#17324d;background:#ffffff;border-color:#9bb4c8;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.tile{padding:12px;border:1px solid white;background:#ffffffb9;border-radius:8px;color:#17324d}.tile b{display:block;margin-bottom:6px}.muted{font-size:12px;color:#587187}#splash{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse,#315b7c,#081629 72%);transition:opacity .5s}.logo{font-size:60px}.brand{font-size:clamp(24px,5vw,38px);font-weight:300}.sub{font-size:13px;color:#c2d5e5;margin-top:10px}.progress{width:170px;height:4px;background:#ffffff40;margin-top:30px}.progress i{display:block;height:100%;background:white;animation:load 1.6s forwards}@keyframes load{to{width:100%}}#notice{display:none;position:absolute;right:10px;top:10px;background:#142b45eF;padding:10px;border:1px solid #fff8;border-radius:8px;z-index:2000}
@media(max-width:520px){.win{left:2%!important;top:4%!important;width:96vw!important;height:86vh!important;resize:none}.head button{padding:5px 8px}#bar{gap:5px}#start{padding:7px 10px}}
</style></head><body>
<div id="splash"><div class="logo">🪟</div><div class="brand">Windows Total Pro</div><div class="sub">Fernando Juan · SOLUCIONES CARBONO PRO</div><div class="progress"><i></i></div></div>
<div id="desktop"><div id="icons"><button class="desk" data-open="pc"><span>🖥️</span><small>Mi PC</small></button></div></div>
<div id="menu"><b>Windows Total Pro v6</b><div class="grid"><button data-open="pc">🖥️ Mi PC</button><button data-open="apps">🧩 Aplicaciones</button><button data-open="personal">🎨 Personalización</button><button data-open="about">ℹ️ Acerca de</button></div><button id="hideMenu">Cerrar menú</button><button id="shutdown">⏻ Cerrar entorno</button></div>
<div id="bar"><button id="start">🪟 Inicio</button><div id="tasks"></div><div id="clock">--:--</div></div><div id="notice"></div><input id="picker" type="file" accept=".html,.htm,text/html" multiple hidden>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);let db=null,z=20,n=0;
function note(t){let e=$('#notice');e.textContent=t;e.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>e.style.display='none',3000)}
function database(){return new Promise((ok,no)=>{let q=indexedDB.open('WTP6_DB',1);q.onupgradeneeded=()=>q.result.createObjectStore('apps',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
function request(mode,fn){return new Promise((ok,no)=>{let t=db.transaction('apps',mode),r=fn(t.objectStore('apps'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)})}
function win(title,content,full=false){let id='w'+(++n),w=document.createElement('section');w.className='win';w.style.zIndex=++z;if(full)Object.assign(w.style,{left:'2%',top:'2%',width:'96%',height:'94%'});w.innerHTML='<div class="head"><span>🪟</span><span class="title"></span><button data-a="min">—</button><button data-a="max">□</button><button data-a="close">✕</button></div><div class="body"></div>';w.querySelector('.title').textContent=title;w.querySelector('.body').append(content);$('#desktop').append(w);let task=document.createElement('button');task.textContent=title;$('#tasks').append(task);task.onclick=()=>{w.style.display='flex';w.style.zIndex=++z};w.onpointerdown=()=>w.style.zIndex=++z;w.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let a=b.dataset.a;if(a==='close'){w.remove();task.remove()}if(a==='min')w.style.display='none';if(a==='max'){if(w.dataset.max){Object.assign(w.style,JSON.parse(w.dataset.old));delete w.dataset.max}else{w.dataset.old=JSON.stringify({left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height});w.dataset.max='1';Object.assign(w.style,{left:'1%',top:'1%',width:'98%',height:'96%'})}}});let h=w.querySelector('.head');h.onpointerdown=e=>{if(e.target.tagName==='BUTTON'||innerWidth<520)return;let r=w.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;h.setPointerCapture(e.pointerId);h.onpointermove=v=>{w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,r.left+v.clientX-sx))+'px';w.style.top=Math.max(0,Math.min(innerHeight-55,r.top+v.clientY-sy))+'px'};h.onpointerup=()=>h.onpointermove=null};return w}
function open(which){$('#menu').classList.remove('show');if(which==='pc')pc();if(which==='apps')apps();if(which==='personal')personal();if(which==='about')about()}
function pc(){let c=document.createElement('div');c.innerHTML='<h2>Mi PC</h2><p>Centro de control de Windows Total Pro.</p><div class="grid"><div class="tile"><b>🖥️ Sistema</b>Windows Total Pro v6 modular</div><div class="tile"><b>🎨 Personalización</b><button data-go="personal">Abrir</button></div><div class="tile"><b>🧩 Aplicaciones</b><button data-go="apps">Administrar</button></div><div class="tile"><b>💾 Almacenamiento</b>Base local IndexedDB</div><div class="tile"><b>🛡️ Seguridad</b>Importa HTML de confianza</div><div class="tile"><b>ℹ️ Acerca de</b><button data-go="about">Ver</button></div></div>';c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go));win('Mi PC',c)}
function about(){let c=document.createElement('div');c.innerHTML='<h2>Windows Total Pro v6</h2><p>Entorno web modular para organizar y ejecutar aplicaciones HTML independientes.</p><b>Fernando Juan, SOLUCIONES CARBONO PRO</b><p>Preparado para la futura integración progresiva de aplicaciones Carbono mediante un contrato común.</p><p class="muted">No es un sistema operativo. La persistencia depende del navegador y sus permisos.</p>';win('Acerca de Windows Total Pro',c)}
function personal(){let c=document.createElement('div');c.innerHTML='<h2>Personalización</h2><p>Selecciona un fondo desde el dispositivo.</p><button id="wall">🖼️ Elegir fondo</button><button id="theme">Cambiar tema claro/oscuro</button><p class="muted">El fondo seleccionado se conserva durante esta sesión.</p>';c.querySelector('#wall').onclick=()=>{let f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{if(f.files[0])$('#desktop').style.backgroundImage='url('+URL.createObjectURL(f.files[0])+')'};f.click()};c.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');win('Personalización',c)}
async function apps(){let c=document.createElement('div');c.innerHTML='<h2>Administrador de aplicaciones</h2><p>Importa HTML locales. Se guarda una copia en este navegador; conserva el archivo original.</p><button id="import">＋ Importar HTML</button><div id="list"></div><p class="muted">Importa solo archivos de confianza. El aislamiento de aplicaciones no constituye una frontera de seguridad absoluta.</p>';win('Aplicaciones',c);c.querySelector('#import').onclick=()=>$('#picker').click();await refresh(c.querySelector('#list'))}
async function refresh(el){let all=await request('readonly',s=>s.getAll());el.replaceChildren();if(!all.length){el.textContent='No hay aplicaciones importadas.';return}all.forEach(a=>{let d=document.createElement('div');d.className='tile';let b=document.createElement('b');b.textContent='📄 '+a.name;let p=document.createElement('p');p.className='muted';p.textContent='Archivo local · '+Math.round(a.html.length/1024)+' KB';let launch=document.createElement('button');launch.textContent='Abrir';launch.onclick=()=>{let f=document.createElement('iframe');f.title=a.name;f.sandbox='allow-scripts allow-forms allow-downloads allow-modals';f.srcdoc=a.html;f.style='width:100%;height:100%;min-height:300px;border:0;background:white';let w=win(a.name,f,true);w.querySelector('.body').style.padding='0'};let del=document.createElement('button');del.textContent='Quitar';del.onclick=async()=>{if(confirm('¿Quitar del lanzador? El original no se modifica.')){await request('readwrite',s=>s.delete(a.id));refresh(el)}};d.append(b,p,launch,del);el.append(d)})}
$('#picker').onchange=async e=>{for(let f of e.target.files){try{let html=await f.text();if(!/<html[\s>]/i.test(html)&&!/<body[\s>]/i.test(html))throw Error('No parece HTML');let id='app-'+Date.now()+'-'+Math.random().toString(36).slice(2);await request('readwrite',s=>s.put({id,name:f.name.replace(/\.html?$/i,''),html}))}catch(x){note(f.name+': '+x.message)}}e.target.value='';let list=document.querySelector('.win:last-of-type #list');if(list)refresh(list);note('Importación finalizada')};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));$('#start').onclick=()=>$('#menu').classList.toggle('show');$('#hideMenu').onclick=()=>$('#menu').classList.remove('show');$('#shutdown').onclick=()=>{if(confirm('¿Cerrar el entorno?')){document.body.innerHTML='<div style="height:100%;display:grid;place-items:center;background:#081629;text-align:center"><div><div style="font-size:55px">🪟</div>Sesión finalizada<br><small>Puedes cerrar esta pestaña.</small></div></div>'}};
function clock(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,15000);
(async()=>{try{db=await database()}catch(e){note('No se pudo iniciar el almacenamiento: '+e.message)}setTimeout(()=>{$('#splash').style.opacity='0';setTimeout(()=>$('#splash').remove(),550)},1700)})();
})();
</script></body></html>
